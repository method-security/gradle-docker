name: 📦 Publish

on:
  push:
    branches:
      - develop
    tags:
      - '*'

permissions:
  id-token: write
  packages: write
  contents: write

jobs:
  checkstyle:
    name: Check
    uses: ./.github/workflows/check.yml

  build:
    name: Build
    uses: ./.github/workflows/build.yml

  publish:
    name: 📦 Publish Artifacts
    runs-on: ubuntu-latest
    needs: [checkstyle, build]
    if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/')
    permissions:
      id-token: write
      packages: write
      contents: write
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: 🔧 Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 🔑 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.CODEARTIFACT_WRITER_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: 🎫 Get CodeArtifact Token
        id: codeartifact
        run: |
          TOKEN=$(aws codeartifact get-authorization-token \
            --domain ${{ secrets.CODEARTIFACT_DOMAIN }} \
            --domain-owner ${{ secrets.AWS_ACCOUNT_ID }} \
            --query authorizationToken \
            --output text)
          echo "::add-mask::$TOKEN"
          echo "CODEARTIFACT_TOKEN=${TOKEN}" >> $GITHUB_ENV

      - name: 🚀 Publish to CodeArtifact
        run: |
          ./gradlew --parallel --stacktrace --continue publish \
            -Porg.gradle.java.installations.fromEnv=JAVA_21_HOME,JAVA_HOME
        env:
          CODEARTIFACT_TOKEN: ${{ env.CODEARTIFACT_TOKEN }}

  check:
    name: ✅ Check
    if: always()

    needs:
      - checkstyle
      - build
      - publish

    runs-on: ubuntu-latest

    steps:
      - name: Require all jobs to succeed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
