buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.palantir.jakartapackagealignment:jakarta-package-alignment:0.6.0'
        classpath 'com.palantir.gradle.jdks:gradle-jdks:0.69.0'
        classpath 'com.palantir.gradle.jdkslatest:gradle-jdks-latest:0.23.0'
        classpath 'com.palantir.gradle.plugintesting:gradle-plugin-testing:0.6.0'
        classpath 'com.palantir.gradle.failure-reports:gradle-failure-reports:1.17.0'
        classpath 'com.palantir.javaformat:gradle-palantir-java-format:2.81.0'
        classpath 'com.palantir.suppressible-error-prone:gradle-suppressible-error-prone:2.24.0'
        classpath 'com.palantir.gradle.consistentversions:gradle-consistent-versions:3.4.0'
        classpath 'com.palantir.baseline:gradle-baseline-java:6.66.0'
        classpath 'com.palantir.gradle.gitversion:gradle-git-version:4.1.0'
        classpath 'com.palantir.gradle.guide:gradle-guide:1.24.0'
        classpath 'com.palantir.gradle.idea-configuration:gradle-idea-configuration:0.7.0'
    }
}

allprojects {
    apply plugin: 'com.palantir.java-format'
    apply plugin: 'com.palantir.jakarta-package-alignment'
}

repositories {
    mavenCentral() { metadataSources { mavenPom(); ignoreGradleMetadataRedirection() } }
}

apply plugin: 'java-gradle-plugin'
apply plugin: 'groovy'
apply plugin: 'maven-publish'
apply plugin: 'com.palantir.baseline'
apply plugin: 'com.palantir.consistent-versions'
apply plugin: 'com.palantir.git-version'
apply plugin: 'com.palantir.gradle-guide'
apply plugin: 'com.palantir.gradle-plugin-testing'
apply plugin: 'com.palantir.jdks'
apply plugin: 'com.palantir.failure-reports'
apply plugin: 'com.palantir.baseline-java-versions'
apply plugin: 'com.palantir.jdks.latest'

group 'com.palantir.gradle.docker'
version System.env.CIRCLE_TAG ?: gitVersion()

dependencies {
    api gradleApi()
    api 'com.google.guava:guava'

    testImplementation gradleTestKit()
    testImplementation 'com.netflix.nebula:nebula-test'
}

gradlePlugin {
    plugins {
        dockerPlugin {
            id = 'com.palantir.docker'
            displayName = 'Palantir Gradle Docker'
            implementationClass = 'com.palantir.gradle.docker.PalantirDockerPlugin'
            description = 'Gradle Docker is a simple docker orchestrator for executing docker build and push from within Gradle.'
        }
        dockerComposePlugin {
            id = 'com.palantir.docker-compose'
            displayName = 'Palantir Gradle Docker-Compose'
            implementationClass = 'com.palantir.gradle.docker.DockerComposePlugin'
            description = 'Gradle Docker is a simple docker orchestrator for executing docker build and push from within Gradle.'
        }
        dockerRunPlugin {
            id = 'com.palantir.docker-run'
            displayName = 'Palantir Gradle Docker-Run'
            implementationClass = 'com.palantir.gradle.docker.DockerRunPlugin'
            description = 'Gradle Docker is a simple docker orchestrator for executing docker build and push from within Gradle.'
        }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            groupId = project.group
            artifactId = project.name
            version = project.version
        }
    }

    repositories {
        maven {
            name = "method-artifacts"
            url = System.getenv('CODEARTIFACT_REPOSITORY_URL')
            credentials {
                username = "aws"
                password = System.getenv('CODEARTIFACT_TOKEN')
            }
            authentication {
                basic(BasicAuthentication)
            }
        }
    }
}

javaVersions {
    libraryTarget = 21
}

jdks {
    daemonTarget = 21
}

gradleTestUtils {
    gradleVersions = ['8.14.3']
}
